# Breakline policy for this repo.
# replacements: the team picks the target model. These targets are DEMO choices;
# confirm each one is live on the provider before merging.
replacements:
  gpt-4o-2024-08-06: gpt-5.4-mini
  gpt-4o-mini-2024-07-18: gpt-5.4-nano
  claude-opus-4-5-20251101: claude-opus-4-6

rules:                       # first match wins; default is ask
  - match: {path: "app/billing/*"}
    action: deny             # finance code: never auto-edit
  - match: {provider: anthropic}
    action: ask              # needs a human approval before merge
  - match: {path: "*"}
    action: allow

parity:
  min_schema_valid: 1.0      # every output must parse and match the schema
  min_label_agreement: 0.95
  max_numeric_drift: 0.05
  max_cost_increase: 0.25
